# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ''

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ''

# Commit message used by `git commit` during repository initialization
init_commit_message: 'docs(spec-kit): initial commit'

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
commit_style: fixed

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: true
  before_clarify:
    enabled: true
    message: 'chore(spec-kit): save progress before clarification'
  before_plan:
    enabled: true
    message: 'chore(spec-kit): save progress before planning'
  before_tasks:
    enabled: true
    message: 'chore(spec-kit): save progress before task generation'
  before_implement:
    enabled: true
    message: 'chore(spec-kit): save progress before implementation'
  before_checklist:
    enabled: true
    message: 'chore(spec-kit): save progress before checklist'
  before_analyze:
    enabled: true
    message: 'chore(spec-kit): save progress before analysis'
  before_taskstoissues:
    enabled: true
    message: 'chore(spec-kit): save progress before issue sync'
  after_constitution:
    enabled: true
    message: 'docs(spec-kit): add project constitution'
  after_specify:
    enabled: true
    message: 'docs(spec-kit): add specification'
  after_clarify:
    enabled: true
    message: 'docs(spec-kit): clarify specification'
  after_plan:
    enabled: true
    message: 'docs(spec-kit): add implementation plan'
  after_tasks:
    enabled: true
    message: 'docs(spec-kit): add tasks'
  after_implement:
    enabled: true
    message: 'chore(spec-kit): implementation progress'
  after_checklist:
    enabled: true
    message: 'docs(spec-kit): add checklist'
  after_analyze:
    enabled: true
    message: 'docs(spec-kit): add analysis report'
  after_taskstoissues:
    enabled: true
    message: 'chore(spec-kit): sync tasks to issues'
