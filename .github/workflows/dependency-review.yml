name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          # uuid@9 (transitive via exceljs) is flagged by GHSA-w5hq-g745-h8pq (missing buffer
          # bounds check in v3/v5/v6 when buf is provided). The vulnerable code path is not used
          # here; upgrading to uuid@11 (the fix) breaks exceljs's CommonJS require.
          allow-ghsas: GHSA-w5hq-g745-h8pq
