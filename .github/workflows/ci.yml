name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PRs (potentially from forks) get a read-only token; only pushes to main
  # (a protected branch) get the read-write token that can populate the cache.
  NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'pull_request' && secrets.NX_CLOUD_READ_ONLY_ACCESS_TOKEN || secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v5

      - run: npm run format:check

      - run: npx nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

  test:
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.yml's postgres service and DatabaseService's
      # defaults, so the backend e2e specs (holdings.e2e-spec.ts,
      # health.e2e-spec.ts) can migrate and query a real database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultfolio
          POSTGRES_PASSWORD: vaultfolio
          POSTGRES_DB: vaultfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultfolio -d vaultfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v5

      - run: npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD
