server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy browser-side API calls to the backend container, so the
    # frontend and backend appear to the browser as a single origin — no
    # CORS, and no hardcoded hostname/port that would break once this isn't
    # accessed via localhost (e.g. deployed on a NAS). The trailing slashes
    # on both `location` and `proxy_pass` strip the /api prefix before
    # forwarding, so /api/holdings -> http://backend:3000/holdings.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
