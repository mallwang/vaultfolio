# Local SonarQube Community Build for offline analysis (npm run sonar:local).
# Mirrors the SonarQube Cloud "Sonar way" profile closely enough to catch the
# same findings before pushing. Not used by CI.
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
