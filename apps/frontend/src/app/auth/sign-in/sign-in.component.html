<div class="sign-in-page">
  <p-card [header]="'signIn.title' | translate" styleClass="sign-in-card">
    <form (ngSubmit)="submit()" class="sign-in-form">
      <div class="field">
        <label for="email">{{ 'signIn.email' | translate }}</label>
        <input
          pInputText
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          [(ngModel)]="email"
          required
        />
      </div>
      <div class="field">
        <label for="password">{{ 'signIn.password' | translate }}</label>
        <input
          pInputText
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
      </div>

      @if (errorMessage()) {
        <p-message severity="error">{{ errorMessage() }}</p-message>
      }

      <p-button
        type="submit"
        [label]="'signIn.submit' | translate"
        [loading]="submitting()"
        [disabled]="submitting()"
      />

      <p class="field-hint">
        {{ 'signIn.noAccount' | translate }}
        <a routerLink="/signup">{{ 'signIn.signUp' | translate }}</a>
      </p>
    </form>
  </p-card>
</div>
