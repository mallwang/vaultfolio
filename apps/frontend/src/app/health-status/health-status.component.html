<section class="health-status">
  <h1>Vaultfolio</h1>

  @if (health(); as result) {
    <p [class.ok]="result.status === 'ok'" [class.degraded]="result.status === 'degraded'">
      Backend status: <strong>{{ result.status }}</strong> — database:
      <strong>{{ result.database }}</strong>
    </p>
    <p class="timestamp">Checked at {{ result.timestamp }}</p>
  } @else if (error()) {
    <p class="degraded">{{ error() }}</p>
  } @else {
    <p>Checking backend health…</p>
  }
</section>
