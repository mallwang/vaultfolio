<div class="invite-page">
  <p-card styleClass="invite-card is-expired">
    <div class="invite-expired-icon">
      <app-icon name="clock" />
    </div>
    <h1>This invitation link isn't valid</h1>
    <p class="lede">
      It's already been used, cancelled, or has expired. Nothing about your invitation or any
      account was changed. Ask an administrator to send a new invitation.
    </p>
    <p-button label="Go to sign in" severity="secondary" routerLink="/sign-in">
      <ng-template #icon><app-icon name="lock" /></ng-template>
    </p-button>
  </p-card>
</div>
