<div class="invite-page">
  @if (!loading()) {
    <p-card class="invite-card">
      <h1>{{ 'acceptInvite.title' | translate }}</h1>
      <p class="lede">{{ lede() }}</p>

      <div class="invited-email">{{ email() }}</div>

      <form (ngSubmit)="submit()" class="invite-form">
        <div class="field">
          <label for="display-name">{{ 'acceptInvite.nameLabel' | translate }}</label>
          <input
            pInputText
            id="display-name"
            name="displayName"
            [(ngModel)]="displayName"
            required
          />
        </div>

        <div class="field">
          <label for="accept-password">{{ 'acceptInvite.passwordLabel' | translate }}</label>
          <input
            pInputText
            id="accept-password"
            name="password"
            type="password"
            [placeholder]="'acceptInvite.passwordPlaceholder' | translate"
            autocomplete="new-password"
            [(ngModel)]="password"
            required
          />
          <p class="field-hint">{{ 'acceptInvite.passwordHint' | translate }}</p>
        </div>

        <div class="field">
          <label for="accept-password-confirm">{{
            'acceptInvite.confirmPasswordLabel' | translate
          }}</label>
          <input
            pInputText
            id="accept-password-confirm"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>

        @if (errorMessage()) {
          <p-message severity="error">{{ errorMessage() }}</p-message>
        }

        <p-button
          type="submit"
          data-testid="accept-invite-submit"
          [label]="'acceptInvite.submit' | translate"
          [loading]="submitting()"
          [disabled]="submitting()"
        >
          <ng-template #icon><app-icon name="check-circle" /></ng-template>
        </p-button>
      </form>
    </p-card>
  }
</div>
