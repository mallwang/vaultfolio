<div class="toolbar">
  <button type="button" class="link" data-testid="dashboard-edit-open" (click)="editOpen.set(true)">
    <app-icon name="pencil" />
    <span class="link__label">{{ 'dashboard.edit.link' | translate }}</span>
  </button>
</div>
<app-dashboard-edit-dialog [(visible)]="editOpen" />

<div
  class="card-row"
  cdkDropList
  cdkDropListOrientation="mixed"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (tile of tiles(); track tile.id; let i = $index) {
    <div class="tile" cdkDrag [attr.data-testid]="'dashboard-tile-' + tile.id">
      <button
        type="button"
        class="tile__handle"
        cdkDragHandle
        [attr.data-testid]="'dashboard-tile-handle-' + tile.id"
        [attr.aria-label]="('dashboard.moveTile' | translate) + ': ' + (tile.titleKey | translate)"
        (keydown)="onHandleKeydown($event, i)"
      >
        <app-icon name="drag-handle" />
      </button>
      <p-card>
        @if (maintenance.isInMaintenance(tile.domainId) && !isAdmin()) {
          <app-dashboard-tile
            [tileId]="tile.id"
            [testIdPrefix]="'dashboard-tile-' + tile.id"
            [title]="tile.titleKey | translate"
          >
            <app-maintenance-tile [testId]="'dashboard-tile-maintenance-' + tile.id" />
          </app-dashboard-tile>
        } @else {
          @if (maintenance.isInMaintenance(tile.domainId)) {
            <app-maintenance-tile
              [badge]="true"
              [testId]="'dashboard-tile-maintenance-badge-' + tile.id"
            />
          }
          <app-dynamic-outlet [loader]="tile.widget.loadComponent" />
        }
      </p-card>
      @if (domainOf(tile.domainId); as domain) {
        <span
          class="tile__domain"
          role="img"
          [attr.title]="domainHint(domain.labelKey)"
          [attr.aria-label]="domainHint(domain.labelKey)"
          [attr.data-testid]="'tile-domain-' + tile.id"
        >
          <app-icon [name]="domain.icon" size="1rem" />
        </span>
      }
    </div>
  }
</div>
