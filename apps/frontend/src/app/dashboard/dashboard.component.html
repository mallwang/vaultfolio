<div class="card-row">
  <p-card [header]="'dashboard.totalValue' | translate">
    <div class="stat-card__placeholder">
      <app-icon name="wallet" class="stat-card__placeholder-icon" />
      <span>{{ 'dashboard.comingSoon' | translate }}</span>
      <p>{{ 'dashboard.totalValueBody' | translate }}</p>
    </div>
  </p-card>
  <p-card [header]="'dashboard.todaysChange' | translate">
    <div class="stat-card__placeholder">
      <app-icon name="trending-up" class="stat-card__placeholder-icon" />
      <span>{{ 'dashboard.comingSoon' | translate }}</span>
      <p>{{ 'dashboard.todaysChangeBody' | translate }}</p>
    </div>
  </p-card>
  <p-card [header]="'dashboard.allocation' | translate">
    <app-holdings-distribution [holdings]="holdings()" />
  </p-card>
</div>

<p-card>
  <div class="empty-state">
    <app-icon name="chart-line" class="empty-state__icon" />
    <h2>{{ 'dashboard.emptyStateTitle' | translate }}</h2>
    <p>{{ 'dashboard.emptyStateBody' | translate }}</p>
  </div>
</p-card>
