<nav class="app-sidebar" aria-label="Primary">
  <div class="app-nav">
    @for (area of areas(); track area.id) {
      <a
        class="app-nav__item"
        [attr.data-testid]="'sidebar-nav-item-' + area.id"
        [routerLink]="['/app', area.path]"
        routerLinkActive="app-nav__item--active"
        ariaCurrentWhenActive="page"
        [pTooltip]="collapsed() ? (area.labelKey | translate) : ''"
        tooltipPosition="right"
        appendTo="body"
      >
        @if (area.logoAsset && !logoFailed().has(area.id)) {
          <img class="app-nav__logo" [src]="area.logoAsset" alt="" (error)="onLogoError(area.id)" />
        } @else {
          <app-icon [name]="area.icon" />
        }
        @if (!collapsed()) {
          <span>{{ area.labelKey | translate }}</span>
        }
      </a>
    }
  </div>

  <button
    class="app-sidebar__toggle"
    data-testid="sidebar-collapse-toggle"
    type="button"
    (click)="toggleCollapsed()"
    [attr.aria-label]="(collapsed() ? 'nav.expandSidebar' : 'nav.collapseSidebar') | translate"
    [pTooltip]="(collapsed() ? 'nav.expandSidebar' : 'nav.collapseSidebar') | translate"
    tooltipPosition="right"
    appendTo="body"
  >
    <app-icon [name]="collapsed() ? 'chevron-right' : 'chevron-left'" />
  </button>
</nav>
