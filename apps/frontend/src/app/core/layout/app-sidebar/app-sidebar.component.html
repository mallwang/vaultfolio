<nav class="app-sidebar" aria-label="Primary">
  <div class="app-nav">
    @for (area of areas(); track area.id) {
      <a
        class="app-nav__item"
        [routerLink]="['/app', area.path]"
        routerLinkActive="app-nav__item--active"
        ariaCurrentWhenActive="page"
      >
        <i [class]="area.icon" aria-hidden="true"></i>
        <span>{{ 'nav.' + area.id | translate }}</span>
      </a>
    }
  </div>
</nav>
