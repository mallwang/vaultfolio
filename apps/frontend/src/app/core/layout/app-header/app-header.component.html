<div class="app-header__brand">
  <img class="app-header__logo" src="/vaultfolio-logo.png" alt="" aria-hidden="true" />
  <div>
    <p class="app-header__crumb">{{ 'header.brand' | translate }}</p>
    <h1 class="app-header__title">{{ activeAreaTitleKey() | translate }}</h1>
  </div>
</div>
@if (isAuthenticated()) {
  <div class="app-header__meta">
    <span>{{ user()?.displayName }}</span>
    @if (user()?.role) {
      <span class="role-badge">{{ roleLabelKey() | translate }}</span>
    }
    <p-select
      class="app-header__language-select"
      data-testid="language-switcher"
      [options]="languageOptions"
      optionLabel="label"
      optionValue="code"
      [ngModel]="language()"
      [attr.aria-label]="'header.language' | translate"
      [pTooltip]="'header.language' | translate"
      tooltipPosition="bottom"
      appendTo="body"
      (onChange)="setLanguage($event.value)"
    >
      <ng-template #selectedItem let-selected>
        <span
          class="app-header__language-flag fi"
          [class]="selected.flag"
          aria-hidden="true"
        ></span>
      </ng-template>
      <ng-template #item let-option>
        <span class="app-header__language-flag fi" [class]="option.flag" aria-hidden="true"></span>
      </ng-template>
      <ng-template #dropdownicon><app-icon name="chevron-down" /></ng-template>
    </p-select>
    <button
      pButton
      data-testid="theme-toggle"
      type="button"
      iconOnly
      severity="secondary"
      [text]="true"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="
        theme() === 'dark'
          ? ('header.switchToLightTheme' | translate)
          : ('header.switchToDarkTheme' | translate)
      "
      [pTooltip]="
        theme() === 'dark'
          ? ('header.switchToLightTheme' | translate)
          : ('header.switchToDarkTheme' | translate)
      "
      tooltipPosition="bottom"
      appendTo="body"
      (click)="toggleTheme()"
    >
      <app-icon [name]="theme() === 'dark' ? 'moon' : 'sun'" />
    </button>
    <p-button
      severity="secondary"
      text
      [attr.aria-label]="'header.signOut' | translate"
      [pTooltip]="'header.signOut' | translate"
      tooltipPosition="bottom"
      appendTo="body"
      (onClick)="signOut()"
    >
      <ng-template #icon><app-icon name="sign-out" /></ng-template>
    </p-button>
  </div>
} @else {
  <div class="app-header__controls">
    <p-select
      class="app-header__language-select"
      data-testid="language-switcher"
      [options]="languageOptions"
      optionLabel="label"
      optionValue="code"
      [ngModel]="language()"
      [attr.aria-label]="'header.language' | translate"
      [pTooltip]="'header.language' | translate"
      tooltipPosition="bottom"
      appendTo="body"
      (onChange)="setLanguage($event.value)"
    >
      <ng-template #selectedItem let-selected>
        <span
          class="app-header__language-flag fi"
          [class]="selected.flag"
          aria-hidden="true"
        ></span>
      </ng-template>
      <ng-template #item let-option>
        <span class="app-header__language-flag fi" [class]="option.flag" aria-hidden="true"></span>
      </ng-template>
      <ng-template #dropdownicon><app-icon name="chevron-down" /></ng-template>
    </p-select>
    <button
      pButton
      data-testid="theme-toggle"
      type="button"
      iconOnly
      severity="secondary"
      [text]="true"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="
        theme() === 'dark'
          ? ('header.switchToLightTheme' | translate)
          : ('header.switchToDarkTheme' | translate)
      "
      [pTooltip]="
        theme() === 'dark'
          ? ('header.switchToLightTheme' | translate)
          : ('header.switchToDarkTheme' | translate)
      "
      tooltipPosition="bottom"
      appendTo="body"
      (click)="toggleTheme()"
    >
      <app-icon [name]="theme() === 'dark' ? 'moon' : 'sun'" />
    </button>
  </div>
}
