<div class="app-header__brand">
  <img class="app-header__logo" src="/vaultfolio-logo.png" alt="" aria-hidden="true" />
  <div>
    <p class="app-header__crumb">Vaultfolio</p>
    <h1 class="app-header__title">{{ activeAreaTitle() }}</h1>
  </div>
</div>
@if (isAuthenticated()) {
  <div class="app-header__meta">
    <span>{{ user()?.displayName }}</span>
    @if (user()?.role) {
      <span class="role-badge">{{ roleLabel() }}</span>
    }
    <p-avatar [label]="userInitials()" shape="circle" />
    <button
      pButton
      data-testid="theme-toggle"
      type="button"
      iconOnly
      severity="secondary"
      [text]="true"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [pTooltip]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleTheme()"
    >
      <i [class]="theme() === 'dark' ? 'pi pi-moon' : 'pi pi-sun'" aria-hidden="true"></i>
    </button>
    <p-button
      icon="pi pi-sign-out"
      severity="secondary"
      text
      aria-label="Sign out"
      pTooltip="Sign out"
      (onClick)="signOut()"
    />
  </div>
} @else {
  <button
    pButton
    data-testid="theme-toggle"
    type="button"
    iconOnly
    severity="secondary"
    [text]="true"
    [attr.aria-pressed]="theme() === 'dark'"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [pTooltip]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    <i [class]="theme() === 'dark' ? 'pi pi-moon' : 'pi pi-sun'" aria-hidden="true"></i>
  </button>
}
