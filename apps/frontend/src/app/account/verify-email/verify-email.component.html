<div class="invite-page">
  @if (state() === 'ready') {
    <p-card styleClass="invite-card">
      @if (confirmedEmail()) {
        <div class="invite-expired-icon">
          <app-icon name="check-circle" />
        </div>
        <h1>Email confirmed</h1>
        <p class="lede">
          Your account email is now {{ confirmedEmail() }}. You can sign in with it.
        </p>
        <p-button label="Go to sign in" severity="secondary" routerLink="/sign-in">
          <ng-template #icon><app-icon name="lock" /></ng-template>
        </p-button>
      } @else {
        <h1>Confirm your new email</h1>
        <p class="lede">
          Confirm <strong>{{ newEmail() }}</strong> as your new Vaultfolio email address.
        </p>
        <p-button
          label="Confirm email change"
          [loading]="confirming()"
          [disabled]="confirming()"
          (onClick)="confirm()"
        >
          <ng-template #icon><app-icon name="check-circle" /></ng-template>
        </p-button>
      }
    </p-card>
  }
</div>
