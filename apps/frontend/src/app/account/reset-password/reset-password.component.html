<div class="invite-page">
  @if (!loading()) {
    <p-card styleClass="invite-card">
      <h1>Set a new password</h1>
      <p class="lede">Choose a new password for your account to finish resetting it.</p>

      <form (ngSubmit)="submit()" class="invite-form">
        <div class="field">
          <label for="reset-password-field">New password</label>
          <input
            pInputText
            id="reset-password-field"
            name="newPassword"
            type="password"
            placeholder="8–200 characters"
            autocomplete="new-password"
            [(ngModel)]="newPassword"
            required
          />
        </div>
        <div class="field">
          <label for="reset-password-confirm">Confirm new password</label>
          <input
            pInputText
            id="reset-password-confirm"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>

        @if (errorMessage()) {
          <p-message severity="error">{{ errorMessage() }}</p-message>
        }

        <p-button
          type="submit"
          label="Reset password & sign in"
          icon="pi pi-check-circle"
          [loading]="submitting()"
          [disabled]="submitting()"
        />
      </form>
    </p-card>
  }
</div>
