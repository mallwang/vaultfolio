<div class="invite-page">
  @if (!loading()) {
    <p-card class="invite-card">
      <h1>{{ 'resetPassword.title' | translate }}</h1>
      <p class="lede">{{ 'resetPassword.lede' | translate }}</p>

      <form (ngSubmit)="submit()" class="invite-form">
        <div class="field">
          <label for="reset-email">{{ 'resetPassword.emailLabel' | translate }}</label>
          <input
            pInputText
            id="reset-email"
            type="email"
            [value]="email()"
            disabled
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="reset-password-field">{{
            'resetPassword.newPasswordLabel' | translate
          }}</label>
          <input
            pInputText
            id="reset-password-field"
            name="newPassword"
            type="password"
            [placeholder]="'resetPassword.newPasswordPlaceholder' | translate"
            autocomplete="new-password"
            [(ngModel)]="newPassword"
            required
          />
        </div>
        <div class="field">
          <label for="reset-password-confirm">{{
            'resetPassword.confirmPasswordLabel' | translate
          }}</label>
          <input
            pInputText
            id="reset-password-confirm"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>

        @if (errorMessage()) {
          <p-message severity="error">{{ errorMessage() | translate }}</p-message>
        }

        <p-button
          type="submit"
          data-testid="reset-password-submit"
          [label]="'resetPassword.submit' | translate"
          [loading]="submitting()"
          [disabled]="submitting()"
        >
          <ng-template #icon><app-icon name="check-circle" /></ng-template>
        </p-button>
      </form>
    </p-card>
  }
</div>
