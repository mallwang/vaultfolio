<div class="invite-page">
  <p-card styleClass="invite-card is-expired">
    <div class="invite-expired-icon">
      <i class="pi pi-clock" aria-hidden="true"></i>
    </div>
    <h1>This link isn't valid</h1>
    <p class="lede">
      It's already been used, superseded by a newer request, or has expired. Nothing has changed.
      Request a new link from account settings or the forgot-password page.
    </p>
    <p-button label="Go to sign in" icon="pi pi-lock" severity="secondary" routerLink="/sign-in" />
  </p-card>
</div>
