<p-dialog
  [header]="'signups.rejectConfirmHeader' | translate"
  [modal]="true"
  [visible]="visible"
  [style]="{ width: '28rem' }"
  (visibleChange)="close()"
>
  @if (errorMessage()) {
    <p-message severity="error" styleClass="reject-dialog__error">{{ errorMessage() }}</p-message>
  }

  <p class="reject-dialog__lede">
    {{ ('signups.rejectLede' | translate).replace('{{email}}', signupEmail) }}
  </p>

  <div class="field">
    <label for="reject-reason">{{ 'signups.rejectReasonLabel' | translate }}</label>
    <input
      pInputText
      id="reject-reason"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      autocomplete="off"
    />
  </div>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" (click)="close()">
      {{ 'invitations.keepIt' | translate }}
    </button>
    <button pButton type="button" severity="danger" [loading]="submitting()" (click)="submit()">
      <i class="pi pi-times" aria-hidden="true"></i> {{ 'signups.rejectSignup' | translate }}
    </button>
  </ng-template>
</p-dialog>
