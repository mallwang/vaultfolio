<p-dialog
  [header]="'invitations.inviteAMember' | translate"
  [modal]="true"
  [visible]="visible"
  [style]="{ width: '28rem' }"
  (visibleChange)="close()"
>
  <ng-template #closeicon><app-icon name="close" /></ng-template>
  @if (errorMessage()) {
    <p-message severity="error" styleClass="invite-dialog__error">{{ errorMessage() }}</p-message>
  }

  <div class="field">
    <label for="invite-email">{{ 'signIn.email' | translate }}</label>
    <input
      pInputText
      id="invite-email"
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      autocomplete="off"
    />
  </div>

  <div class="field">
    <label for="invite-role">{{ 'accounts.columnRole' | translate }}</label>
    <p-select
      id="invite-role"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="role()"
      (ngModelChange)="role.set($event)"
    >
      <ng-template #dropdownicon><app-icon name="chevron-down" /></ng-template>
    </p-select>
  </div>

  <p class="invite-dialog__hint">{{ 'invitations.dialogHint' | translate }}</p>

  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      pButton
      type="button"
      [loading]="submitting()"
      [disabled]="!email().trim()"
      (click)="submit()"
    >
      <app-icon name="send" /> {{ 'invitations.sendInvitation' | translate }}
    </button>
  </ng-template>
</p-dialog>
