# SonarQube Cloud project configuration — CI-based analysis.
# Automatic Analysis is disabled in SonarCloud project settings; the scan
# runs from .github/workflows/ci.yml instead (see that file for the actual
# scanner invocation and required SONAR_TOKEN secret).
sonar.projectKey=mallwang_vaultfolio
sonar.organization=mallwang

# Nx monorepo: everything under apps/ and libs/ is source, nothing else.
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts
sonar.exclusions=**/dist/**,**/out-tsc/**,**/test-output/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/jest.config.cts,**/jest.config.ts,**/jest.config.js,**/webpack.config.js,**/webpack.config.ts
sonar.cpd.exclusions=**/i18n/translations/**

# Bootstrap / environment files have no testable logic — exclude from coverage only.
sonar.coverage.exclusions=**/main.ts,**/environment*.ts,**/app.config.ts

# Coverage: lcov reports from both coverage layouts in this workspace —
# apps/backend, apps/frontend and every @angular/build:unit-test project
# write to <workspaceRoot>/coverage/<project>/lcov.info; the remaining Jest
# libs write to <projectRoot>/test-output/jest/coverage/lcov.info.
# Generated by `npm run test:coverage` (nx run-many -t test --coverage).
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info,**/test-output/jest/coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/**/lcov.info,**/test-output/jest/coverage/lcov.info

# Needed for PR decoration / new-code analysis against the right base.
sonar.scm.provider=git
