services:
  backend:
    image: ${DOCKERHUB_USER:-walefish}/vaultfolio-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_PATH: /data/vaultfolio.db
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_INACTIVITY_TIMEOUT_MINUTES: ${SESSION_INACTIVITY_TIMEOUT_MINUTES:-30}
      SESSION_ABSOLUTE_LIFETIME_HOURS: ${SESSION_ABSOLUTE_LIFETIME_HOURS:-12}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ACCOUNT_RETENTION_DAYS: ${ACCOUNT_RETENTION_DAYS:-30}
      INVITATION_EXPIRY_DAYS: ${INVITATION_EXPIRY_DAYS:-7}
    volumes:
      - /opt/vaultfolio/data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: the frontend's nginx reaches this container over
    # the compose network at http://backend:3000. Uncomment to also allow
    # direct API access (e.g. for debugging) from the NAS's LAN:
    # ports:
    #   - '3000:3000'

  frontend:
    image: ${DOCKERHUB_USER:-walefish}/vaultfolio-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      PRIMENG_LICENSE_KEY: ${PRIMENG_LICENSE_KEY:-}
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy
