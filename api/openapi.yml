info:
  title: Vaultfolio API
  description: >-
    Vaultfolio is a self-hosted personal finance tracker for manually tracking
    investments across ETFs, shares, precious metals, crypto, and more. Source,
    issues, and the full README live at https://github.com/mallwang/vaultfolio.


    This document is generated directly from the backend controllers and DTOs,
    so it always matches what is actually running.


    ### Authentication


    Every endpoint below except `/health` and `/auth/sign-in` requires the
    vaultfolio_session session cookie set by signing in (via the app, or via
    `POST /auth/sign-in` below) — it is not a separate credential scheme. That
    cookie is httpOnly, so it rides along automatically on every "Try it out"
    call once you are signed in; there is nothing to enter in the "Authorize"
    dialog below, which exists only to mark which endpoints require it.
  version: 0.0.9
  contact: {}
tags: []
servers:
  - url: /api
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vaultfolio_session
      description: >-
        Set automatically by your browser after signing in (via the app, or via
        `POST /auth/sign-in` below) — this cookie is httpOnly, so there is
        nothing to paste here; it will be sent with "Try it out" requests
        regardless of this dialog.
  schemas:
    SignInRequestDto:
      type: object
      properties:
        email:
          type: string
          example: admin@example.com
        password:
          type: string
          format: password
      required:
        - email
        - password
    SessionUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: admin@example.com
        displayName:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - MEMBER
        domainScopes:
          description: Domain ids this user is entitled to, independent of `role`.
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - role
        - domainScopes
    AuthErrorResponseDto:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - account_locked
            - unauthenticated
            - forbidden
        message:
          type: string
      required:
        - error
        - message
    HoldingResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - ETF
            - SHARE
            - PRECIOUS_METAL
            - CRYPTO
            - DEPOSIT_MONEY
        management:
          type: string
          description: Freeform label for who/what manages this holding.
        quantity:
          type: object
          nullable: true
          example: '10'
          description: Decimal string.
        purchasePrice:
          type: object
          nullable: true
          example: '123.45'
          description: Decimal string.
        purchaseDate:
          type: object
          nullable: true
          format: date
        isin:
          type: object
          nullable: true
        name:
          type: object
          nullable: true
        weightGrams:
          type: object
          nullable: true
          example: '15.5'
          description: Decimal string.
        currentValue:
          type: object
          nullable: true
          example: '1000.00'
          description: Decimal string.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - assetType
        - management
        - createdAt
        - updatedAt
    CreateEtfHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: &ref_15
            - ETF
        management:
          type: string
        isin:
          type: string
        name:
          type: string
        quantity:
          type: string
          example: '10'
        purchasePrice:
          type: string
          example: '123.45'
      required:
        - assetType
        - management
        - isin
        - name
        - quantity
        - purchasePrice
    CreateShareHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: &ref_16
            - SHARE
        management:
          type: string
        isin:
          type: string
        name:
          type: string
        quantity:
          type: string
          example: '10'
        purchasePrice:
          type: string
          example: '123.45'
        purchaseDate:
          type: string
          format: date
          description: Omit entirely, not "".
      required:
        - assetType
        - management
        - isin
        - name
        - quantity
        - purchasePrice
    CreatePreciousMetalHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: &ref_17
            - PRECIOUS_METAL
        management:
          type: string
        name:
          type: string
        weightGrams:
          type: string
          example: '15.5'
        currentValue:
          type: string
          example: '1000.00'
          description: Used only by the distribution view.
      required:
        - assetType
        - management
        - name
        - weightGrams
    CreateCryptoHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: &ref_18
            - CRYPTO
        management:
          type: string
        name:
          type: string
        quantity:
          type: string
          example: '0.5'
        purchasePrice:
          type: string
          example: '30000.00'
        purchaseDate:
          type: string
          format: date
          description: Omit entirely, not "".
      required:
        - assetType
        - management
        - name
        - quantity
        - purchasePrice
    CreateDepositMoneyHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: &ref_19
            - DEPOSIT_MONEY
        management:
          type: string
        name:
          type: string
        currentValue:
          type: string
          example: '5000.00'
      required:
        - assetType
        - management
        - name
        - currentValue
    HoldingValidationErrorResponseDto:
      type: object
      properties:
        error:
          type: string
          enum:
            - VALIDATION_FAILED
        message:
          type: string
        fieldErrors:
          type: array
