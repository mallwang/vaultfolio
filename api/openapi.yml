            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
        - error
        - message
        - fieldErrors
    UpdateEtfHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: *ref_15
        management:
          type: string
        isin:
          type: string
        name:
          type: string
        quantity:
          type: string
          example: '10'
        purchasePrice:
          type: string
          example: '123.45'
      required:
        - assetType
        - management
        - isin
        - name
        - quantity
        - purchasePrice
    UpdateShareHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: *ref_16
        management:
          type: string
        isin:
          type: string
        name:
          type: string
        quantity:
          type: string
          example: '10'
        purchasePrice:
          type: string
          example: '123.45'
        purchaseDate:
          type: string
          format: date
          description: Omit entirely, not "".
      required:
        - assetType
        - management
        - isin
        - name
        - quantity
        - purchasePrice
    UpdatePreciousMetalHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
          enum: *ref_17
        management:
          type: string
        name:
          type: string
        weightGrams:
          type: string
          example: '15.5'
        currentValue:
          type: string
          example: '1000.00'
          description: Used only by the distribution view.
      required:
        - assetType
        - management
        - name
        - weightGrams
    UpdateCryptoHoldingRequestDto:
      type: object
      properties:
        assetType:
          type: string
