openapi: 3.0.0
paths:
  /auth/sign-in:
    post:
      operationId: AuthController_signIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUserDto'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
        '429':
          description: Too many failed attempts for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      summary: Sign in with email/password, starting a new session.
      tags: &ref_0
        - auth
  /auth/sign-out:
    post:
      operationId: AuthController_signOut
      parameters: []
      responses:
        '204':
          description: Signed out.
      security:
        - sessionCookie: []
      summary: End the current session, clearing the session cookie.
      tags: *ref_0
  /auth/session:
    get:
      operationId: AuthController_session
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUserDto'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponseDto'
      security:
        - sessionCookie: []
      summary: Get the current signed-in user.
      tags: *ref_0
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  database:
                    type: string
                    enum:
                      - connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - degraded
                  database:
                    type: string
                    enum:
                      - unreachable
                  timestamp:
                    type: string
                    format: date-time
      summary: Report backend/database health.
      tags:
        - health
  /holdings:
    get:
      operationId: HoldingsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponseDto'
      security: &ref_1
        - sessionCookie: []
      summary: List the caller's holdings.
      tags: &ref_2
        - holdings
    post:
      operationId: HoldingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateEtfHoldingRequestDto'
                - $ref: '#/components/schemas/CreateShareHoldingRequestDto'
                - $ref: '#/components/schemas/CreatePreciousMetalHoldingRequestDto'
                - $ref: '#/components/schemas/CreateCryptoHoldingRequestDto'
